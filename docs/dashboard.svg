<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="'Plus Jakarta Sans',system-ui,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2b3550" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1200" height="620" fill="#fdfaf4"/>

  <!-- header -->
  <g transform="translate(40,26)">
    <rect width="26" height="26" rx="8" fill="#e8a838"/>
    <text x="13" y="18" font-size="14" text-anchor="middle" fill="#22293d">₹</text>
    <text x="36" y="18" font-size="16" font-weight="800" fill="#22293d">Paisa<tspan fill="#e8a838">Wise</tspan></text>
  </g>
  <g transform="translate(1010,22)">
    <circle cx="16" cy="16" r="16" fill="#6366f1"/>
    <text x="16" y="21" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">SG</text>
    <text x="42" y="21" font-size="13.5" font-weight="600" fill="#22293d">Sujay</text>
  </g>

  <!-- chat panel -->
  <g transform="translate(40,74)" filter="url(#s)">
    <rect width="768" height="516" rx="18" fill="#fff" stroke="#eadfcc"/>
    <line x1="0" y1="46" x2="768" y2="46" stroke="#eadfcc"/>
    <circle cx="22" cy="23" r="4" fill="#4ade80"/>
    <text x="34" y="28" font-size="12.5" fill="#8a8f9c">Synced to your account</text>
    <rect x="540" y="10" width="118" height="27" rx="8" fill="#fff" stroke="#eadfcc"/>
    <text x="599" y="28" font-size="11.5" font-weight="600" fill="#22293d" text-anchor="middle">📷 Scan receipt</text>
    <rect x="666" y="10" width="88" height="27" rx="8" fill="#fff" stroke="#eadfcc"/>
    <text x="710" y="28" font-size="11.5" font-weight="600" fill="#22293d" text-anchor="middle">+ New chat</text>

    <!-- user bubble -->
    <rect x="430" y="66" width="318" height="34" rx="12" fill="#22293d"/>
    <text x="446" y="88" font-size="12.5" font-family="'JetBrains Mono',monospace" fill="#fdfaf4">340 swiggy, 30 auto, 50 coffee</text>

    <!-- flashcards -->
    <g font-family="'JetBrains Mono',monospace" font-size="11.5" fill="#22293d">
      <text x="22" y="132">┌─────────────────────────┐  ┌─────────────────────────┐</text>
      <text x="22" y="150">│ 🍕 FOOD                 │  │ 🚗 TRAVEL               │</text>
      <text x="22" y="168">│ ₹340 · Swiggy           │  │ ₹30 · —                 │</text>
      <text x="22" y="186">│ dinner                  │  │ auto to college         │</text>
      <text x="22" y="204">└─────────────────────────┘  └─────────────────────────┘</text>

      <text x="22" y="240" fill="#8a8f9c">📊 SPENDING SNAPSHOT</text>
      <text x="22" y="256" fill="#eadfcc">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>
      <text x="22" y="276">🍕 Food     ₹390  ███████████████  93%</text>
      <text x="22" y="294">🚗 Travel   ₹ 30  █░░░░░░░░░░░░░░   7%</text>
      <text x="22" y="310" fill="#eadfcc">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>
      <text x="22" y="330" font-weight="600">💰 Total: ₹420</text>
    </g>

    <rect x="22" y="348" width="500" height="34" rx="11" fill="#e4f7ee"/>
    <text x="38" y="370" font-size="12.5" fill="#1f6b4f">💡 TIP: Food is 93% of spend. Two home meals ≈ ₹150 saved.</text>

    <!-- input -->
    <rect x="18" y="440" width="732" height="58" rx="14" fill="#fdfaf4" stroke="#eadfcc"/>
    <text x="36" y="474" font-size="13" fill="#a8adb8">e.g. 250 zomato dinner, auto 30 college, 1.2k myntra shoes</text>
    <rect x="694" y="456" width="38" height="26" rx="8" fill="#22293d"/>
    <text x="713" y="474" font-size="12" fill="#fdfaf4" text-anchor="middle">↑</text>
  </g>

  <!-- sidebar -->
  <g transform="translate(830,74)" filter="url(#s)">
    <rect width="330" height="516" rx="18" fill="#fff" stroke="#eadfcc"/>

    <rect x="16" y="16" width="150" height="28" rx="8" fill="#f2ece0"/>
    <rect x="19" y="19" width="72" height="22" rx="6" fill="#fff"/>
    <text x="55" y="34" font-size="11" font-weight="700" fill="#22293d" text-anchor="middle">Dashboard</text>
    <text x="130" y="34" font-size="11" font-weight="600" fill="#8a8f9c" text-anchor="middle">History</text>
    <text x="296" y="34" font-size="11" fill="#8a8f9c" text-anchor="end">↺ Reset</text>

    <rect x="16" y="58" width="145" height="64" rx="12" fill="#fbeed3" stroke="#eadfcc"/>
    <text x="30" y="80" font-size="10.5" fill="#8a7a55">All time</text>
    <text x="30" y="106" font-size="24" font-weight="800" fill="#22293d">₹420</text>

    <rect x="169" y="58" width="145" height="64" rx="12" fill="#e4f7ee" stroke="#d3ece0"/>
    <text x="183" y="80" font-size="10.5" fill="#5c8a76">This week</text>
    <text x="183" y="106" font-size="24" font-weight="800" fill="#22293d">₹420</text>

    <rect x="16" y="134" width="298" height="56" rx="12" fill="#fdeceb" stroke="#f5cfcc"/>
    <text x="30" y="155" font-size="11" font-weight="700" fill="#c0392b">⚠ Money Leaks Detected</text>
    <text x="30" y="176" font-size="12" fill="#c0392b">🍕 Food is eating 93% of your budget (₹390)</text>

    <rect x="16" y="204" width="56" height="24" rx="7" fill="#22293d"/>
    <text x="44" y="220" font-size="10.5" font-weight="600" fill="#fdfaf4" text-anchor="middle">Bar</text>
    <rect x="78" y="204" width="56" height="24" rx="7" fill="#fff" stroke="#eadfcc"/>
    <text x="106" y="220" font-size="10.5" font-weight="600" fill="#22293d" text-anchor="middle">Pie</text>

    <!-- bar chart -->
    <g transform="translate(16,244)">
      <text x="0" y="14" font-size="10.5" fill="#6b7280">Food</text>
      <rect x="54" y="3" width="234" height="16" rx="5" fill="#e8a838"/>
      <text x="0" y="42" font-size="10.5" fill="#6b7280">Travel</text>
      <rect x="54" y="31" width="20" height="16" rx="5" fill="#4ade80"/>
    </g>

    <line x1="16" y1="316" x2="314" y2="316" stroke="#eadfcc"/>
    <rect x="16" y="332" width="298" height="34" rx="10" fill="#fff" stroke="#eadfcc"/>
    <text x="165" y="354" font-size="12" font-weight="600" fill="#22293d" text-anchor="middle">🧠 Get Monthly Insights</text>

    <rect x="16" y="380" width="298" height="56" rx="11" fill="#fdeceb" stroke="#f5cfcc"/>
    <text x="30" y="400" font-size="10.5" font-weight="700" fill="#c0392b">TOP MONEY LEAKS</text>
    <text x="30" y="418" font-size="11" fill="#22293d">1. Food at 93% — cap delivery at 2/week</text>

    <rect x="16" y="446" width="298" height="54" rx="11" fill="#e4f7ee" stroke="#d3ece0"/>
    <text x="30" y="466" font-size="10.5" font-weight="700" fill="#1f6b4f">HABIT TO CHANGE</text>
    <text x="30" y="484" font-size="11" fill="#22293d">Ask "need or want?" before ordering in.</text>
  </g>
</svg>
