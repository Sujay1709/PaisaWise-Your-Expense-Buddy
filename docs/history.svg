<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="'Plus Jakarta Sans',system-ui,sans-serif">
  <defs>
    <filter id="h" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2b3550" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="760" height="470" fill="#fdfaf4"/>

  <g transform="translate(40,30)" filter="url(#h)">
    <rect width="680" height="410" rx="18" fill="#fff" stroke="#eadfcc"/>

    <rect x="20" y="20" width="150" height="28" rx="8" fill="#f2ece0"/>
    <text x="59" y="38" font-size="11" font-weight="600" fill="#8a8f9c" text-anchor="middle">Dashboard</text>
    <rect x="98" y="23" width="68" height="22" rx="6" fill="#fff"/>
    <text x="132" y="38" font-size="11" font-weight="700" fill="#22293d" text-anchor="middle">History</text>
    <text x="646" y="38" font-size="11" fill="#8a8f9c" text-anchor="end">↺ Reset</text>

    <!-- normal row -->
    <rect x="20" y="62" width="626" height="50" rx="12" fill="#fdfaf4" stroke="#eadfcc"/>
    <text x="38" y="92" font-size="13">🍕</text>
    <text x="62" y="85" font-size="12.5" font-weight="600" fill="#22293d">Swiggy</text>
    <text x="62" y="102" font-size="10.5" fill="#8a8f9c">Food · 28 Jul · dinner</text>
    <text x="530" y="93" font-size="13" font-weight="700" fill="#22293d" text-anchor="end">₹340</text>
    <text x="576" y="93" font-size="12" fill="#a8adb8">✎</text>
    <text x="612" y="93" font-size="12" fill="#a8adb8">🗑</text>

    <!-- editing row -->
    <rect x="20" y="122" width="626" height="76" rx="12" fill="#fff" stroke="#e8a838" stroke-width="1.6"/>
    <rect x="36" y="136" width="76" height="24" rx="7" fill="#fdfaf4" stroke="#eadfcc"/>
    <text x="74" y="152" font-size="12" font-weight="600" fill="#22293d" text-anchor="middle">30</text>
    <rect x="120" y="136" width="84" height="24" rx="7" fill="#fdfaf4" stroke="#eadfcc"/>
    <text x="162" y="152" font-size="10.5" fill="#22293d" text-anchor="middle">Travel ▾</text>
    <text x="588" y="152" font-size="13" fill="#4ade80">✓</text>
    <text x="620" y="152" font-size="12" fill="#a8adb8">✕</text>
    <rect x="36" y="166" width="150" height="22" rx="6" fill="#fdfaf4" stroke="#eadfcc"/>
    <text x="46" y="181" font-size="10" fill="#a8adb8">Merchant</text>
    <rect x="194" y="166" width="436" height="22" rx="6" fill="#fdfaf4" stroke="#eadfcc"/>
    <text x="204" y="181" font-size="10" fill="#22293d">auto to college</text>

    <!-- more rows -->
    <rect x="20" y="208" width="626" height="50" rx="12" fill="#fdfaf4" stroke="#eadfcc"/>
    <text x="38" y="238" font-size="13">🛍️</text>
    <text x="62" y="231" font-size="12.5" font-weight="600" fill="#22293d">Myntra</text>
    <text x="62" y="248" font-size="10.5" fill="#8a8f9c">Shopping · 27 Jul · shoes</text>
    <text x="530" y="239" font-size="13" font-weight="700" fill="#22293d" text-anchor="end">₹1,200</text>

    <rect x="20" y="268" width="626" height="50" rx="12" fill="#fdfaf4" stroke="#eadfcc"/>
    <text x="38" y="298" font-size="13">📦</text>
    <text x="62" y="291" font-size="12.5" font-weight="600" fill="#22293d">Freelance logo</text>
    <text x="62" y="308" font-size="10.5" fill="#8a8f9c">Other · 26 Jul · income</text>
    <text x="530" y="299" font-size="13" font-weight="700" fill="#3aa676" text-anchor="end">+₹5,000</text>

    <rect x="20" y="332" width="626" height="34" rx="10" fill="#fff" stroke="#eadfcc"/>
    <text x="333" y="354" font-size="12" font-weight="600" fill="#22293d" text-anchor="middle">Load more</text>

    <text x="333" y="388" font-size="10.5" fill="#a8adb8" text-anchor="middle">Keyset pagination — page 500 costs the same as page 1</text>
  </g>
</svg>
