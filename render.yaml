# Render Blueprint — free tier deployment
# Database is Neon (separate, permanently free). Render's own free Postgres
# is deleted after 30 days, so it is deliberately not used here.
services:
  - type: web
    name: paisawise
    runtime: node
    plan: free
    region: singapore # closest Render region to India
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Render sits behind one proxy; the real client IP is the last
      # X-Forwarded-For entry. See rate-limit.server.ts.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Keep the pool small — Neon's free tier allows limited connections
      # and Render free runs a single instance.
      - key: PG_POOL_MAX
        value: "5"
      - key: AI_PROVIDER_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL
        value: gemini-2.0-flash
      # Lets visitors toggle Pro to see quota behaviour. No payment is taken.
      - key: ALLOW_DEMO_UPGRADE
        value: "true"
      # Set these in the Render dashboard — never commit them.
      - key: DATABASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
