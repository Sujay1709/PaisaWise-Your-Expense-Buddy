<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PaisaWise — offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        padding: 1.5rem; background: #fdfaf4; color: #22293d;
        font: 15px/1.6 "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #141a28; color: #f4f1ea; }
        .card { border-color: rgba(255,255,255,.14) !important; background: #1b2231 !important; }
        .hint { color: #9aa1b1 !important; }
      }
      .card {
        max-width: 24rem; width: 100%; text-align: center; padding: 2rem 1.5rem;
        border: 1px solid #eadfcc; border-radius: 1.25rem; background: #fff;
      }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 1rem; border-radius: 16px;
        background: #e8a838; display: grid; place-items: center;
        font-size: 28px; font-weight: 800; color: #22293d;
      }
      h1 { font-size: 1.15rem; margin: 0 0 .5rem; }
      .hint { color: #6b7280; font-size: .9rem; margin: 0 0 1.25rem; }
      button {
        font: inherit; font-weight: 600; cursor: pointer;
        padding: .6rem 1.4rem; border-radius: .6rem;
        border: none; background: #22293d; color: #fdfaf4;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">₹</div>
      <h1>You're offline</h1>
      <p class="hint">
        PaisaWise needs a connection to load your expenses — showing you a stale
        balance would be worse than showing none.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
